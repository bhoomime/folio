    (function (d) {
      try { if (localStorage.getItem('bh-theme') === 'blue') { d.dataset.theme = 'blue'; var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = getComputedStyle(d).getPropertyValue('--paper').trim(); } } catch (e) {}

      try { if (localStorage.getItem('bh-still') === '1') d.classList.add('still'); } catch (e) {}
    })(document.documentElement);

    </div>
